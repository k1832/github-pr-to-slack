<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Copy PR Link — Options</title>
  <style>
    body {
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 420px; margin: 24px auto; padding: 0 16px; color: #1f2328;
    }
    h1 { font-size: 16px; }
    #shortcut {
      width: 100%; padding: 10px 12px; font-size: 15px; text-align: center;
      border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box;
      cursor: pointer; background: #f6f8fa;
    }
    #shortcut:focus { outline: 2px solid #0969da; background: #fff; }
    .hint { color: #656d76; font-size: 12px; margin-top: 6px; }
    button { margin-top: 12px; padding: 6px 14px; border-radius: 6px; border: 1px solid #d0d7de; background: #f6f8fa; cursor: pointer; }
    #status { color: #1a7f37; font-size: 12px; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>Copy PR Link shortcut</h1>
  <input id="shortcut" readonly placeholder="Click, then press a key combination">
  <p class="hint">Must include Cmd, Ctrl, or Alt. Saved automatically.</p>
  <button id="reset">Reset to default</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
